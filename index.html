
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKREMPRO - Laser Survival</title>
<style>
body {
  background: #050505;
  color: #00d9ff;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
}
h1 {
  text-shadow: 0 0 15px #00d9ff;
}
button {
  background: #00d9ff;
  color: #000;
  border: 0;
  padding: 13px 18px;
  margin: 6px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:active {
  transform: scale(0.95);
}
#arena {
  display: none;
  max-width: 500px;
  height: 320px;
  margin: 20px auto;
  border: 2px solid #00d9ff;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  background: radial-gradient(#10242b, #000);
}
#player {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 38px;
}
.laser {
  position: absolute;
  width: 5px;
  height: 30px;
  background: red;
  box-shadow: 0 0 12px red;
  border-radius: 5px;
}
#message {
  min-height: 24px;
}
</style>
</head>
<body>

<h1>⚡ EKREMPRO ⚡</h1>
<p>LASER SURVIVAL</p>

<div id="start">
  <p>Lazerlərdən yayın və sağ qal!</p>
  <button onclick="startGame()">OYUNA BAŞLA</button>
</div>

<div id="arena">
  <div id="player">🧑‍🚀</div>
</div>

<div id="controls" style="display:none">
  <h3>Can: <span id="lives">3</span> ❤️</h3>
  <p>Xal: <span id="score">0</span></p>
  <button onclick="move(-25)">⬅️ SOL</button>
  <button onclick="fire()">⚡ ATƏŞ</button>
  <button onclick="move(25)">SAĞ ➡️</button>
  <p id="message">Sağ qal!</p>
  <button onclick="restartGame()">YENİDƏN BAŞLA</button>
</div>

<script>
var running = false;
var lives = 3;
var score = 0;
var playerX = 50;
var laserTimer;
var scoreTimer;
var lasers = [];

function startGame() {
  if (running) return;

  running = true;
  lives = 3;
  score = 0;
  playerX = 50;

  document.getElementById("start").style.display = "none";
  document.getElementById("arena").style.display = "block";
  document.getElementById("controls").style.display = "block";
  document.getElementById("lives").innerText = lives;
  document.getElementById("score").innerText = score;
  document.getElementById("message").innerText = "Oyun başladı!";

  document.getElementById("player").style.left = playerX + "%";

  laserTimer = setInterval(createLaser, 900);
  scoreTimer = setInterval(function() {
    if (running) {
      score++;
      document.getElementById("score").innerText = score;
    }
  }, 1000);
}

function move(amount) {
  if (!running) return;

  playerX += amount / 5;

  if (playerX < 5) playerX = 5;
  if (playerX > 95) playerX = 95;

  document.getElementById("player").style.left = playerX + "%";
}

function createLaser() {
  if (!running) return;

  var arena = document.getElementById("arena");
  var laser = document.createElement("div");

  laser.className = "laser";
  laser.style.left = Math.random() * (arena.clientWidth - 10) + "px";
  laser.style.top = "0px";

  arena.appendChild(laser);
  lasers.push(laser);

  var y = 0;

  var fall = setInterval(function() {
    if (!running) {
      clearInterval(fall);
      laser.remove();
      return;
    }

    y += 5;
    laser.style.top = y + "px";

    var lx = parseFloat(laser.style.left);
    var playerPixelX = playerX / 100 * arena.clientWidth;
    var playerY = arena.clientHeight - 40;

    if (
      y + 25 >= playerY &&
      y <= playerY + 35 &&
      Math.abs(lx - playerPixelX) < 28
    ) {
      clearInterval(fall);
      laser.remove();
      lives--;
      document.getElementById("lives").innerText = lives;

      if (lives <= 0) {
        endGame();
      } else {
        document.getElementById("message").innerText =
          "Lazer dəydi! Diqqətli ol!";
      }
      return;
    }

    if (y > arena.clientHeight) {
      clearInterval(fall);
      laser.remove();
    }
  }, 35);
}

function fire() {
  if (!running) return;

  score += 5;
  document.getElementById("score").innerText = score;
  document.getElementById("message").innerText = "⚡ ATƏŞ! +5 xal";
}

function endGame() {
  running = false;
  clearInterval(laserTimer);
  clearInterval(scoreTimer);

  document.getElementById("message").innerText =
    "OYUN BİTDİ! Xalın: " + score;
}

function restartGame() {
  running = false;
  clearInterval(laserTimer);
  clearInterval(scoreTimer);

  var arena = document.getElementById("arena");
  var oldLasers = arena.querySelectorAll(".laser");

  oldLasers.forEach(function(laser) {
    laser.remove();
  });

  startGame();
}

document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowLeft" || event.key === "a") move(-25);
  if (event.key === "ArrowRight" || event.key === "d") move(25);
  if (event.code === "Space") {
    event.preventDefault();
    fire();
  }
});
</script>

</body>
</html>
