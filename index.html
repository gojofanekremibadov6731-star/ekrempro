
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKREMPRO Multiplayer</title>
<style>
body {
  background: #05070d;
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.box {
  max-width: 500px;
  margin: 25px auto;
  padding: 20px;
  border: 1px solid #00eaff;
  border-radius: 15px;
  background: #0b1020;
}
input, button {
  padding: 12px;
  margin: 6px;
  border-radius: 8px;
}
button {
  background: #00eaff;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
li {
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1>⚡ EKREMPRO</h1>
<h2>🏁 Multiplayer Race</h2>

<div class="box">
  <input id="playerName" maxlength="16"
         placeholder="Oyuncu adın">
  <button id="joinBtn">OYUNA QOŞUL</button>
  <p id="status">Firebase bağlantısı gözlənilir...</p>
  <h3 id="score">Xal: 0</h3>
  <button id="raceBtn" disabled>🏃 QAÇ!</button>
</div>

<div class="box">
  <h2>🏆 Liderlər cədvəli</h2>
  <ol id="leaderboard"></ol>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {
  getAuth, signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
import {
  getDatabase, ref, set, onValue, update
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA7DATN9BpZ46svlGT4B-FLCv4mMLzbQqQ",
  authDomain: "ekrempro.firebaseapp.com",
  databaseURL: "https://ekrempro-default-rtdb.firebaseio.com",
  projectId: "ekrempro",
  storageBucket: "ekrempro.firebasestorage.app",
  messagingSenderId: "18182912269",
  appId: "1:18182912269:web:842a6251821845a63fd844",
  measurementId: "G-DY1N54HTKG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let uid = null;
let score = 0;
let joined = false;

const status = document.getElementById("status");
const scoreText = document.getElementById("score");
const joinBtn = document.getElementById("joinBtn");
const raceBtn = document.getElementById("raceBtn");
const nameInput = document.getElementById("playerName");

signInAnonymously(auth).then((result) => {
  uid = result.user.uid;
  status.textContent = "Giriş hazır! Adını yaz və qoşul.";
}).catch((error) => {
  status.textContent = "Giriş xətası: " + error.message;
});

joinBtn.onclick = async function() {
  if (!uid) {
    status.textContent = "Bir az gözlə, giriş hazırlanır.";
    return;
  }

  const name = nameInput.value.trim();

  if (!name) {
    status.textContent = "Əvvəlcə adını yaz!";
    return;
  }

  try {
    const playersRef = ref(db, "rooms/main/players");
    const snapshot = await new Promise((resolve, reject) => {
      onValue(playersRef, resolve, reject, { onlyOnce: true });
    });

    const players = snapshot.val() || {};

    if (!players[uid] &&
        Object.keys(players).length >= 100) {
      status.textContent = "Oyun doludur! Maksimum 100 nəfər.";
      return;
    }

    await set(ref(db, "rooms/main/players/" + uid), {
      name: name.slice(0, 16),
      score: 0
    });

    joined = true;
    raceBtn.disabled = false;
    nameInput.disabled = true;
    joinBtn.disabled = true;
    status.textContent = "Oyuna qoşuldun! QAÇ düyməsinə bas!";
  } catch (error) {
    status.textContent =
      "Database icazəsi yoxdur. Firebase Rules yoxlanmalıdır.";
  }
};

raceBtn.onclick = async function() {
  if (!joined || !uid) return;

  score += 1;
  scoreText.textContent = "Xal: " + score;

  try {
    await update(ref(db, "rooms/main/players/" + uid), {
      score: score
    });
  } catch (error) {
    status.textContent =
      "Xal saxlanmadı. Database Rules icazə vermir.";
  }
};

onValue(ref(db, "rooms/main/players"), (snapshot) => {
  const players = Object.entries(snapshot.val() || {});
  players.sort((a, b) =>
    (Number(b[1].score) || 0) -
    (Number(a[1].score) || 0)
  );

  const list = document.getElementById("leaderboard");
  list.replaceChildren();

  players.forEach((entry, index) => {
    const item = document.createElement("li");
    item.textContent =
      (index + 1) + ". " +
      entry[1].name + " — " +
      (Number(entry[1].score) || 0) + " xal";
    list.appendChild(item);
  });
}, (error) => {
  status.textContent = "Oxuma icazəsi yoxdur: " + error.message;
});
</script>
</body>
</html>
